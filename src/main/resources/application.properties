quarkus.http.port=8010

# --- Long-running request connectivity --------------------------------------
# Schema generation, wide joins, and databases with many connected services can
# run for minutes. read-timeout only bounds how long we wait for the *request*
# to arrive; idle-timeout bounds a connection that goes quiet mid-query. Keep it
# open for the whole execution (matches atomiq.query.timeout.max-seconds below)
# instead of cutting it at Vert.x's default idle window.
quarkus.http.idle-timeout=30M
quarkus.http.read-timeout=60S

# Per-statement JDBC query timeout (seconds): the default applied when the
# client sends none, and the hard ceiling the run-query utility clamps to.
# Raise max-seconds if you legitimately run longer analytical queries.
atomiq.query.timeout.default-seconds=120
atomiq.query.timeout.max-seconds=1800

# Connect (login) timeout for *reaching* a target database, seconds. Bounds only
# the TCP/login handshake so a dead host fails fast — a slow query is governed by
# the query timeout above, not this.
atomiq.db.connect-timeout-seconds=15

# Enable Swagger UI in dev mode (it's on by default, but explicit is better)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# OpenAPI spec path
mp.openapi.extensions.smallrye.info.title=Atomic API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Atomic Backend Application

# DataSource
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# WAL lets reads and the single writer proceed concurrently; busy_timeout makes a
# connection wait (ms) for a locked DB instead of failing with SQLITE_BUSY.
quarkus.datasource.jdbc.url=jdbc:sqlite:./atomic.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
# SQLite has a single writer, so one pooled connection serializes access cleanly.
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.min-size=1
# Wait up to 30s to get the (single) connection from the pool instead of failing fast.
quarkus.datasource.jdbc.acquisition-timeout=30S

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.packages=com.shared.model, com.database.model

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=blog-app 